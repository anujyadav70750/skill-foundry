<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Skill Foundry — Practical Skills Platform &amp; Resource Library">
  <defs>
    <linearGradient id="sf-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101d"/>
      <stop offset="50%" stop-color="#060b14"/>
      <stop offset="100%" stop-color="#04070d"/>
    </linearGradient>
    <linearGradient id="sf-accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c8cff"/>
      <stop offset="100%" stop-color="#3dd6d0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#sf-bg)"/>

  <!-- Subtle Outer Border Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="20" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5"/>

  <!-- SF Brand Mark Icon -->
  <g transform="translate(546, 96)">
    <rect width="108" height="108" rx="28" fill="#0d1b2a" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <path d="M24 24h60" stroke="#7c8cff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
    <text x="54" y="76" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#3dd6d0">SF</text>
  </g>

  <!-- Brand Name -->
  <text x="600" y="268" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="48" font-weight="800" letter-spacing="0.12em" fill="#f8fafc">SKILL FOUNDRY</text>

  <!-- Accent Divider -->
  <path d="M530 300h140" stroke="url(#sf-accent-line)" stroke-width="3" stroke-linecap="round"/>

  <!-- Tagline / Platform Identity -->
  <text x="600" y="358" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="25" font-weight="600" fill="#dce4ee">Practical Skills Platform &amp; Resource Library</text>

  <!-- Supporting Subcopy -->
  <text x="600" y="402" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="18" font-weight="400" fill="#94a3b8">Clear guides, real-world workflows, and modern tool tutorials</text>

  <!-- Descriptor Pill / Focus Areas -->
  <g transform="translate(280, 464)">
    <rect width="640" height="52" rx="26" fill="rgba(13, 27, 42, 0.85)" stroke="rgba(124, 140, 255, 0.22)" stroke-width="1"/>
    <text x="320" y="32" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Plus Jakarta Sans', sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.14em" fill="#aeb8c5">
      <tspan fill="#3dd6d0">• </tspan>PRACTICAL SKILLS<tspan dx="18" fill="#7c8cff">• </tspan><tspan dx="4">TUTORIALS &amp; WORKFLOWS</tspan><tspan dx="18" fill="#3dd6d0">• </tspan><tspan dx="4">TOOLS &amp; PROJECTS</tspan>
    </text>
  </g>
</svg>
