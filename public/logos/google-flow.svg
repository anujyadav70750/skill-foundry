<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Google Flow">
  <defs>
    <!-- Dark Sleek Background -->
    <linearGradient id="gflowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#050914"/>
    </linearGradient>

    <!-- Google 4-Color AI Gradient for Flow Sweep -->
    <linearGradient id="gflowMainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4"/>
      <stop offset="28%" stop-color="#24C1E0"/>
      <stop offset="55%" stop-color="#A142F4"/>
      <stop offset="78%" stop-color="#EA4335"/>
      <stop offset="90%" stop-color="#FBBC05"/>
      <stop offset="100%" stop-color="#34A853"/>
    </linearGradient>

    <!-- Interlacing Secondary Ribbon Gradient -->
    <linearGradient id="gflowLoopGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#F43F5E"/>
    </linearGradient>

    <!-- Glow & Shadow -->
    <radialGradient id="gflowCenterGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#A142F4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <filter id="gflowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#4285F4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="112" fill="url(#gflowBg)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="rgba(255, 255, 255, 0.14)" stroke-width="4"/>

  <!-- Radial Glow Behind Logo -->
  <circle cx="256" cy="256" r="220" fill="url(#gflowCenterGlow)"/>

  <!-- Google Flow Symbol: Fluid AI Wave Ribbon -->
  <g filter="url(#gflowShadow)">
    <path d="M 124 336 C 124 240, 208 176, 288 176 C 368 176, 400 232, 384 288 C 368 344, 296 368, 224 336 C 160 308, 144 232, 192 176 C 240 120, 336 128, 388 160" 
          fill="none" 
          stroke="url(#gflowMainGrad)" 
          stroke-width="48" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <path d="M 216 196 C 264 140, 352 144, 388 172" 
          fill="none" 
          stroke="url(#gflowLoopGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          opacity="0.92"/>
  </g>

  <!-- Google AI Four-Point Sparkle Star -->
  <g transform="translate(376, 116)">
    <path d="M 0 -30 C 3 -12, 12 -3, 30 0 C 12 3, 3 12, 0 30 C -3 12, -12 3, -30 0 C -12 -3, -3 -12, 0 -30 Z" fill="#FBBC05"/>
    <circle cx="0" cy="0" r="7" fill="#FFFFFF"/>
  </g>

  <!-- Secondary Cyan Sparkle Star -->
  <g transform="translate(136, 148)">
    <path d="M 0 -18 C 2 -7, 7 -2, 18 0 C 7 2, 2 7, 0 18 C -2 7, -7 2, -18 0 C -7 -2, -2 -7, 0 -18 Z" fill="#38BDF8"/>
  </g>
</svg>
