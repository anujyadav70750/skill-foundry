name: Fix resource anchor URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-anchor-url:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prevent prompt anchor from persisting in shared URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/resources/[slug].astro')
          text = path.read_text()
          needle = "    const promptText = document.querySelector('#prompt-text');\n"
          addition = """    document.querySelectorAll('a[href=\"#prompt\"]').forEach((link) => link.addEventListener('click', (event) => {\n      const target = document.getElementById('prompt');\n      if (!target) return;\n      event.preventDefault();\n      target.scrollIntoView({ behavior: 'smooth', block: 'start' });\n      window.history.replaceState(null, '', window.location.pathname + window.location.search);\n    }));\n"""
          if addition in text:
              raise SystemExit('Anchor URL fix is already present; no changes needed.')
          if needle not in text:
              raise SystemExit('Expected prompt script anchor point was not found; no changes made.')
          path.write_text(text.replace(needle, addition + needle, 1))
          PY
          rm -f .github/workflows/fix-resource-anchor-url.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/resources/[slug].astro .github/workflows/fix-resource-anchor-url.yml
          git commit -m "Prevent prompt anchor from persisting in resource URLs"
          git push
