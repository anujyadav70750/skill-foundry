name: Temporary resource step UX patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !startsWith(github.event.head_commit.message, 'fix: refine resource step details UX') && !startsWith(github.event.head_commit.message, 'chore: remove temporary resource step UX patch') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch resource step UX
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('src/pages/resources/[slug].astro')
          text = path.read_text()

          old = '''                            {(step.details && step.details.length > 0) || (step.settings && step.settings.length > 0) ? (\n                              <div class="tutorial-details-grid">\n                                {step.details && step.details.map((detail: any) => (\n                                  <div class="tutorial-detail-item">\n                                    <div class="tutorial-detail-heading">\n                                      <span class="tutorial-detail-emoji" aria-hidden="true">{detail.icon}</span>\n                                      <span class="tutorial-detail-label">{detail.label}</span>\n                                    </div>\n                                    <span class="tutorial-detail-value">{detail.value}</span>\n                                  </div>\n                                ))}\n                                {step.settings && step.settings.map((setting: any) => {\n                                  const label = String(setting.label || '').toUpperCase();\n                                  const settingEmoji = label.includes("MODEL") ? "🎬" : label.includes("ASPECT") ? "📱" : label.includes("DURATION") ? "⏱️" : label.includes("RESOLUTION") ? "🎞️" : label.includes("SPEED") ? "⏩" : "⚙️";\n                                  return (\n                                    <div class="tutorial-detail-item">\n                                      <div class="tutorial-detail-heading">\n                                        <span class="tutorial-detail-emoji" aria-hidden="true">{settingEmoji}</span>\n                                        <span class="tutorial-detail-label">{label}</span>\n                                      </div>\n                                      <span class="tutorial-detail-value">{String(setting.value || '').replace(/^gemini\\s+/i, '')}</span>\n                                    </div>\n                                  );\n                                })}\n                              </div>\n                            ) : null}\n                            {step.settings && step.settings.length > 0 && step.outputDescription && (\n                              <div class="tutorial-details-note">\n                                <div class="tutorial-detail-heading">\n                                  <svg class="tutorial-detail-icon" viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.55" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">\n                                    <rect x="2.5" y="5.2" width="15" height="10.5" rx="2"/>\n                                    <circle cx="10" cy="10.5" r="3"/>\n                                    <path d="m5.2 5.2 1-2h2l1 2"/>\n                                  </svg>\n                                  <span class="tutorial-detail-label">CAMERA</span>\n                                </div>\n                                <p class="tutorial-details-note-copy">{step.outputDescription}</p>\n                              </div>\n                            )}\n'''

          new = '''                            <div class="tutorial-details-grid">\n                              {stepToolName && (\n                                <div class="tutorial-detail-item tutorial-tool-used-item">\n                                  <div class="tutorial-detail-heading">\n                                    <span class="tutorial-detail-emoji" aria-hidden="true">🛠️</span>\n                                    <span class="tutorial-detail-label">TOOL USED</span>\n                                  </div>\n                                  <span class="tutorial-detail-value">{stepToolName}</span>\n                                </div>\n                              )}\n                              {!/chatgpt/i.test(stepToolName) && step.details && step.details.map((detail: any) => (\n                                <div class="tutorial-detail-item">\n                                  <div class="tutorial-detail-heading">\n                                    <span class="tutorial-detail-emoji" aria-hidden="true">{detail.icon}</span>\n                                    <span class="tutorial-detail-label">{detail.label}</span>\n                                  </div>\n                                  <span class="tutorial-detail-value">{detail.value}</span>\n                                </div>\n                              ))}\n                              {step.settings && step.settings.map((setting: any) => {\n                                const label = String(setting.label || '').toUpperCase();\n                                const settingEmoji = label.includes("MODEL") ? "🎬" : label.includes("ASPECT") ? "📱" : label.includes("DURATION") ? "⏱️" : label.includes("RESOLUTION") ? "🎞️" : label.includes("SPEED") ? "⏩" : "⚙️";\n                                return (\n                                  <div class="tutorial-detail-item">\n                                    <div class="tutorial-detail-heading">\n                                      <span class="tutorial-detail-emoji" aria-hidden="true">{settingEmoji}</span>\n                                      <span class="tutorial-detail-label">{label}</span>\n                                    </div>\n                                    <span class="tutorial-detail-value">{String(setting.value || '').replace(/^gemini\\s+/i, '')}</span>\n                                  </div>\n                                );\n                              })}\n                            </div>\n'''

          if old not in text:
              raise SystemExit('Details rendering block not found; aborting without changes.')
          text = text.replace(old, new, 1)

          old_tabs = '''    /* The segmented control itself is the only enclosed element. */\n    .tutorial-step-disclosure-tabs {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 3px;\n      padding: 4px;\n      background: #11151C;\n      border: 1px solid rgba(255, 255, 255, 0.13);\n      border-radius: 10px;\n      box-sizing: border-box;\n    }\n\n    .tutorial-step-disclosure-button {\n      width: 100%;\n      min-width: 0;\n      min-height: 42px;\n      padding: 9px 12px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 7px;\n      border: 1px solid transparent;\n      border-radius: 7px;\n      background: transparent;\n      color: #929BAA;\n      font: 600 13px/1.2 sans-serif;\n      cursor: pointer;\n      box-sizing: border-box;\n      -webkit-tap-highlight-color: transparent;\n      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease;\n    }\n'''

          new_tabs = '''    /* Only the two tab buttons are enclosed; the surrounding control stays transparent. */\n    .tutorial-step-disclosure-tabs {\n      display: grid;\n      grid-template-columns: repeat(2, minmax(0, 1fr));\n      gap: 8px;\n      padding: 0;\n      background: transparent;\n      border: 0;\n      border-radius: 0;\n      box-sizing: border-box;\n    }\n\n    .tutorial-step-disclosure-button {\n      width: 100%;\n      min-width: 0;\n      min-height: 44px;\n      padding: 9px 12px;\n      display: inline-flex;\n      align-items: center;\n      justify-content: center;\n      gap: 7px;\n      border: 1px solid rgba(255, 255, 255, 0.12);\n      border-radius: 10px;\n      background: #11151C;\n      color: #929BAA;\n      font: 600 13px/1.2 sans-serif;\n      cursor: pointer;\n      box-sizing: border-box;\n      -webkit-tap-highlight-color: transparent;\n      transition: background 0.16s ease, border-color 0.16s ease, color 0.16s ease, transform 0.16s ease;\n    }\n'''
          if old_tabs not in text:
              raise SystemExit('Tab CSS block not found; aborting without changes.')
          text = text.replace(old_tabs, new_tabs, 1)

          old_active = '''    .tutorial-step-disclosure-button:hover {\n      background: rgba(255, 255, 255, 0.055);\n      color: #E5E7EB;\n    }\n\n    .tutorial-step-disclosure-button[aria-selected="true"] {\n      background: #35404F;\n      border-color: rgba(255, 255, 255, 0.13);\n      color: #FFFFFF;\n      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 1px 2px rgba(0, 0, 0, 0.22);\n    }\n'''
          new_active = '''    .tutorial-step-disclosure-button:hover {\n      background: #1A1F28;\n      border-color: rgba(255, 255, 255, 0.22);\n      color: #F5F7FA;\n      transform: translateY(-1px);\n    }\n\n    .tutorial-step-disclosure-button[aria-selected="true"] {\n      background: #35404F;\n      border-color: rgba(255, 255, 255, 0.18);\n      color: #FFFFFF;\n      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07), 0 2px 5px rgba(0, 0, 0, 0.22);\n    }\n'''
          if old_active not in text:
              raise SystemExit('Active tab CSS block not found; aborting without changes.')
          text = text.replace(old_active, new_active, 1)

          old_panels = '''    .tutorial-step-disclosure-panels {\n      display: grid;\n      width: 100%;\n      margin-top: 0;\n    }\n'''
          new_panels = '''    .tutorial-step-disclosure-panels {\n      display: grid;\n      width: 100%;\n      margin-top: 0;\n      min-height: var(--sf-disclosure-height, 0px);\n    }\n'''
          if old_panels not in text:
              raise SystemExit('Panel CSS block not found; aborting without changes.')
          text = text.replace(old_panels, new_panels, 1)

          old_js = '''          const initiallySelected = tabButtons.find((button) => button.getAttribute("aria-selected") === "true") || tabButtons[0];\n          activateTab(initiallySelected);\n\n          tabButtons.forEach((button, index) => {\n'''
          new_js = '''          const initiallySelected = tabButtons.find((button) => button.getAttribute("aria-selected") === "true") || tabButtons[0];\n          activateTab(initiallySelected);\n\n          const syncPanelHeight = () => {\n            const height = Math.max(0, ...panels.map((panel) => panel.scrollHeight));\n            disclosure.style.setProperty("--sf-disclosure-height", `${height}px`);\n          };\n          syncPanelHeight();\n          window.addEventListener("resize", syncPanelHeight);\n\n          tabButtons.forEach((button, index) => {\n'''
          if old_js not in text:
              raise SystemExit('Tab JS block not found; aborting without changes.')
          text = text.replace(old_js, new_js, 1)

          path.write_text(text)
          PY

          git diff --check
          git diff -- src/pages/resources/'[slug].astro'
      - name: Commit patched resource UX
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/resources/'[slug].astro'
          git commit -m "fix: refine resource step details UX"
          git push
