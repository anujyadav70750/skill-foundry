name: Refine resource title flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow natural desktop title and description wrapping
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/styles/global.css')
          text = path.read_text()
          old = '''  .resource-intro h1 { max-width: 1000px; }\n  .resource-page .resource-intro .lead { max-width: 980px; }'''
          new = '''  .resource-intro h1 { max-width: none; }\n  .resource-page .resource-intro .lead { max-width: none; }'''
          if old not in text:
              raise SystemExit('Expected desktop resource title rules were not found; no changes made.')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/refine-resource-title-flow.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/global.css .github/workflows/refine-resource-title-flow.yml
          git commit -m "Allow natural resource title wrapping"
          git push
