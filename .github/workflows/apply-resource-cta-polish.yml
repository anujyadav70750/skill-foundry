name: Apply resource CTA polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Apply desktop CTA sizing and remove this one-time workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/styles/global.css')
          text = path.read_text()
          marker = '@media (min-width: 769px) {\n  .resource-intro .quick-actions .button-primary {'
          if marker not in text:
              target = '.quick-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }'
              addition = '''\n\n@media (min-width: 769px) {\n  .resource-intro .quick-actions .button-primary {\n    min-width: 440px;\n    min-height: 56px;\n    padding-inline: 28px;\n  }\n}\n'''
              if target not in text:
                  raise SystemExit('Expected quick-actions CSS rule was not found; no changes made.')
              path.write_text(text.replace(target, target + addition, 1))
          PY

          rm -f .github/workflows/apply-resource-cta-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles/global.css .github/workflows/apply-resource-cta-polish.yml
          git commit -m "Polish desktop resource CTA sizing"
          git push
