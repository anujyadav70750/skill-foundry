name: One-time logo polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace fragile tool logo proxy with universal favicon resolver
        run: |
          python - <<'PY'
          from pathlib import Path
          page = Path('src/pages/resources/[slug].astro')
          text = page.read_text()
          old = '''const toolLogo = (tool) => tool?.url\n  ? `/api/tool-logo-image?url=${encodeURIComponent(tool.url)}&v=20260916-4`\n  : '/skill-foundry-resource-icon.svg';'''
          new = '''const toolLogo = (tool) => {\n  try {\n    const host = new URL(tool?.url || '').hostname;\n    return host ? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(host)}&sz=128` : '/skill-foundry-resource-icon.svg';\n  } catch {\n    return '/skill-foundry-resource-icon.svg';\n  }\n};'''
          if old not in text:
              raise SystemExit('Expected toolLogo block not found')
          page.write_text(text.replace(old, new, 1))
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/pages/resources/[slug].astro'
          git commit -m "fix: use reliable universal tool logo resolver"
          git push
