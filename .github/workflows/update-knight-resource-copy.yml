# One-time copy update workflow
name: Update cinematic knight resource copy

on:
  push:
    paths:
      - '.github/workflows/update-knight-resource-copy.yml'

permissions:
  contents: write

jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update approved resource copy
        run: |
          python - <<'PY'
          from pathlib import Path

          resource = Path('src/content/resources/cinematic-medieval-knight-video-google-flow.md')
          template = Path('src/pages/resources/[slug].astro')

          r = resource.read_text(encoding='utf-8')
          t = template.read_text(encoding='utf-8')

          replacements_r = [
              ('title: "Create a Cinematic Medieval Knight Video with Google Flow"',
               'title: "Create a Cinematic Medieval Knight Video Like This"'),
              ('description: "Videos like this are going viral on social media and pulling in millions of views. This resource shows you how to create your own version with the character and style you want."',
               'description: "Create your own cinematic medieval character video in this trending AI-generated style. Use your own character, build the world around them, and turn the idea into a cinematic video you can make your own."'),
              ('intro: "Build the video in order: lock the character first, create matching props, establish the location, generate the cinematic shot, then finish the result in Instagram."',
               'intro: "Start with your character, then build the world around them. Keep the character, props, environment, and final video visually consistent from beginning to end."'),
              ('    title: "Create Character Sheet"\n    purpose: "Generate a character sheet for your person."\n    description: "Generate a character sheet for your person."',
               '    title: "Create Your Character Reference"\n    purpose: "Generate a character sheet for your person."\n    description: "Turn your character into a consistent visual reference for the video."'),
              ('    next: "Use this Character Sheet as the reference input for Step 02."\n    handoff: "Use this Character Sheet as the reference input for Step 02."',
               '    next: "Use this character reference in Step 02."\n    handoff: "Use this character reference in Step 02."'),
              ('  - title: "Create Helmet & Sword"\n    purpose: "Create the props for your character."\n    description: "Create the props for your character."',
               '  - title: "Create Matching Props"\n    purpose: "Create the props for your character."\n    description: "Build the key props that belong to your character and match their visual style."'),
              ('    next: "Use this Helmet + Sword Reference as the prop reference for Step 04."\n    handoff: "Use this Helmet + Sword Reference as the prop reference for Step 04."',
               '    next: "Keep this prop reference for the cinematic generation step."\n    handoff: "Keep this prop reference for the cinematic generation step."'),
          ]

          for old, new in replacements_r:
              count = r.count(old)
              if count != 1:
                  raise SystemExit(f'Resource replacement expected 1 match, found {count}: {old[:100]}')
              r = r.replace(old, new)

          replacements_t = [
              ('<h2 class="blueprint-callout-title">Follow the Blueprint Below</h2>\n            <p class="blueprint-callout-desc">Work through each step in order, using each result to build the next until you reach the final result.</p>',
               '<h2 class="blueprint-callout-title">Create It Step by Step</h2>\n            <p class="blueprint-callout-desc">Each part builds on the previous one, taking you from your character reference to the finished cinematic video.</p>'),
              ('<h3 class="what-you-get-title">Complete Workflow</h3>\n              <p class="what-you-get-desc">From the first step to the final result</p>',
               '<h3 class="what-you-get-title">Complete Workflow</h3>\n              <p class="what-you-get-desc">Everything you need to recreate this video style from start to finish.</p>'),
              ('<h3 class="what-you-get-title">Tools Used</h3>\n              <p class="what-you-get-desc">Tap to open the tools used in the workflow</p>',
               '<h3 class="what-you-get-title">Tools Used</h3>\n              <p class="what-you-get-desc">The tools used to create and finish the video.</p>'),
              ('<h3 class="what-you-get-title">Prompts and Settings</h3>\n              <p class="what-you-get-desc">Ready to use prompts and the settings for each step</p>',
               '<h3 class="what-you-get-title">Prompts and Settings</h3>\n              <p class="what-you-get-desc">Ready-to-use prompts and the key instructions for creating each part.</p>'),
              ('<h3 class="what-you-get-title">Resources</h3>\n                <p class="what-you-get-desc">Tap to view and download available reference or generated resources</p>',
               '<h3 class="what-you-get-title">Resources</h3>\n                <p class="what-you-get-desc">Reference images and other assets used throughout the creation.</p>'),
              ('<p class="editorial-subcopy">Tap any tool to open it directly and get started.</p>',
               '<p class="editorial-subcopy">These are the tools used in the original workflow. You can use equivalent tools for your own version.</p>'),
          ]

          for old, new in replacements_t:
              count = t.count(old)
              if count != 1:
                  raise SystemExit(f'Template replacement expected 1 match, found {count}: {old[:120]}')
              t = t.replace(old, new)

          resource.write_text(r, encoding='utf-8')
          template.write_text(t, encoding='utf-8')
          PY

      - name: Verify changes
        run: |
          grep -F 'title: "Create a Cinematic Medieval Knight Video Like This"' src/content/resources/cinematic-medieval-knight-video-google-flow.md
          grep -F 'description: "Create your own cinematic medieval character video in this trending AI-generated style.' src/content/resources/cinematic-medieval-knight-video-google-flow.md
          grep -F '<h2 class="blueprint-callout-title">Create It Step by Step</h2>' 'src/pages/resources/[slug].astro'
          git diff --check

      - name: Commit resource copy changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/resources/cinematic-medieval-knight-video-google-flow.md 'src/pages/resources/[slug].astro'
          git commit -m "Refine cinematic knight resource copy"
          git push
